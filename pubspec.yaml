name: nowdelivery_user_app
description: "Customer-facing mobile application for NowDelivery platform, allowing users to browse products, place orders, and track deliveries in real-time."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  equatable: ^2.0.8
  dio: ^5.9.2
  flutter_screenutil: ^5.9.3
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.5.5
  pretty_dio_logger: ^1.4.0
  lottie: ^3.3.3
  flutter_svg: ^2.3.0
  internet_connection_checker: ^3.0.1
  connectivity_plus: ^6.1.5
  auto_size_text: ^3.0.0
  easy_localization: ^3.0.8
  cached_network_image: ^3.4.1
  badges: ^3.2.0
  carousel_slider: ^5.1.2
  smooth_page_indicator: ^2.0.1
  buttons_tabbar: ^1.3.15
  motion_tab_bar_v2: ^0.4.0
  flutter_svg_provider:
  curved_navigation_bar: ^1.0.6
  animated_bottom_navigation_bar: ^1.4.0
  convex_bottom_bar: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_gen_runner: ^5.14.1
  build_runner: ^2.15.0
flutter_gen:
  output: lib/view/assets/

  # Optional
  integrations:
    image: true
    flutter_svg: true
    rive: true
    lottie: true

flutter:

  uses-material-design: true

  assets:
    - assets/fonts/roboto/
    - assets/json/
    - assets/json/lang/
    - assets/media/images/png/
    - assets/media/images/svg/
    - assets/media/sounds/
    - assets/media/videos/


  fonts:
     - family: Roboto
       fonts:
         - asset: assets/fonts/roboto/Roboto-Light.ttf
     - family: IbmPlexSans
       fonts:
         - asset: assets/fonts/ibm-plex-sans/IBMPlexSansArabic-Bold.ttf
           weight: 700
         - asset: assets/fonts/ibm-plex-sans/IBMPlexSansArabic-ExtraLight.ttf
           weight: 200
         - asset: assets/fonts/ibm-plex-sans/IBMPlexSansArabic-Light.ttf
           weight: 300
         - asset: assets/fonts/ibm-plex-sans/IBMPlexSansArabic-Medium.ttf
           weight: 500
         - asset: assets/fonts/ibm-plex-sans/IBMPlexSansArabic-Regular.ttf
           weight: 400
         - asset: assets/fonts/ibm-plex-sans/IBMPlexSansArabic-SemiBold.ttf
           weight: 600
         - asset: assets/fonts/ibm-plex-sans/IBMPlexSansArabic-Thin.ttf
           weight: 100
