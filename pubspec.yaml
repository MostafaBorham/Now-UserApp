name: nowdelivery_user_app
description: "Customer-facing mobile application for NowDelivery platform, allowing users to browse products, place orders, and track deliveries in real-time."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/fonts/roboto/
    - assets/json/
    - assets/media/images/png/
    - assets/media/images/svg/
    - assets/media/sounds/
    - assets/media/videos/


  fonts:
     - family: Roboto
       fonts:
         - asset: assets/fonts/roboto/Roboto-Light.ttf
